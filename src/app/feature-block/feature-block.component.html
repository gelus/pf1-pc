<div class="feature-block compact-form">
  @if (collapsible) {
    <div class="collapse-header">
      <button
        type="button"
        class="collapse-toggle feature-collapse-toggle pf-btn pf-btn--quiet pf-btn--sm"
        [attr.aria-expanded]="!collapsed"
        (click)="toggleCollapsed()"
      ><span class="collapse-chevron" aria-hidden="true">▾</span>{{ feature.name || 'Unnamed feature' }}</button>
      @if (collapsed) {
        <span class="collapse-summary feature-summary">{{ summary }}</span>
      }
    </div>
  }

  <div class="feature-body" [hidden]="collapsible && collapsed">
    <div class="feature-meta form-grid">
      <label class="inline-field">
        <b>Name</b>
        <input
          type="text"
          name="featureName"
          class="feature-name-input"
          [(ngModel)]="feature.name"
          (ngModelChange)="emitChange()"
          placeholder="Feature name"
        />
      </label>

      <label class="inline-field">
        <b>Show in</b>
        <select name="featureShownIn" class="feature-shown-in-select" [ngModel]="feature.shownIn ?? ''" (ngModelChange)="setShownIn($event)"
          title="where the sheet lists it: by default a race or class feature is listed in the special qualities, unless an entry in its adjustments lists it">
          @for (option of shownInOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </label>

      <div class="feature-flags">
        <label class="inline-field checkbox-field">
          <b>Toggleable</b>
          <input
            type="checkbox"
            name="hasActiveToggle"
            class="feature-toggleable-input"
            [(ngModel)]="hasActiveToggle"
          />
        </label>

        @if (hasActiveToggle) {
          <label class="inline-field checkbox-field">
            <b>Active</b>
            <input
              type="checkbox"
              name="featureActive"
              class="feature-active-input"
              [(ngModel)]="feature.active"
              (ngModelChange)="emitChange()"
            />
          </label>
        }

        <label class="inline-field checkbox-field">
          <b>Charges</b>
          <input
            type="checkbox"
            name="hasCharges"
            class="feature-charges-toggle"
            [(ngModel)]="hasCharges"
          />
        </label>

        <label class="inline-field checkbox-field" title="a form the character changes into (a polymorph spell, wild shape): one is on at a time">
          <b>Form</b>
          <input type="checkbox" name="isForm" class="feature-form-toggle" [ngModel]="!!feature.form" (ngModelChange)="setForm($event)" />
        </label>
      </div>
    </div>

    @if (feature.form) {
      <div class="form-row feature-flags">
        <label class="inline-field checkbox-field" title="an animal, elemental, plant, dragon or vermin form: armor, shields and weapons stop working">
          <b>Melds gear</b>
          <input type="checkbox" name="formMelds" class="feature-form-melds" [(ngModel)]="feature.form.meldsGear" (ngModelChange)="emitChange()" />
        </label>
        <label class="inline-field checkbox-field" title="no hands or voice for spells with verbal or somatic components">
          <b>No spellcasting</b>
          <input type="checkbox" name="formNoCasting" class="feature-form-no-casting" [(ngModel)]="feature.form.noCasting" (ngModelChange)="emitChange()" />
        </label>
        <label class="inline-field">
          <b>From</b>
          <input name="formFrom" class="feature-form-from" placeholder="Beast Shape II" [(ngModel)]="feature.form.from" (ngModelChange)="emitChange()" />
        </label>
      </div>
    }

    <label class="inline-field" title="the level it applies from: a companion's own level (a mount's ability at 11th), else the character level">
      <b>From level</b>
      <input type="number" min="0" name="featureAtLevel" class="feature-at-level" placeholder="always"
        [ngModel]="feature.atLevel ?? null" (ngModelChange)="setAtLevel($event)" />
    </label>

    <label class="inline-field" title="a metamagic feat: the spell levels it adds to a spell's slot (Empower Spell 2); Heighten Spell raises the spell itself">
      <b>Metamagic +levels</b>
      <input type="number" min="0" name="featureMetamagic" class="feature-metamagic" placeholder="not metamagic"
        [ngModel]="feature.metamagic?.levels ?? null" (ngModelChange)="setMetamagic($event)" />
    </label>

    <label class="inline-field" title="the points it costs from a pool: an eidolon's evolution (0 for its base form's free ones)">
      <b>Cost</b>
      <input type="number" min="0" name="featureCost" class="feature-cost" placeholder="none"
        [ngModel]="feature.cost ?? null" (ngModelChange)="setCost($event)" />
    </label>

    <label class="inline-field">
      <b>Prerequisites</b>
      <input name="featurePrerequisites" class="feature-prerequisites" placeholder="a feat's, as its page lists them: Str 13, Power Attack"
        [ngModel]="feature.prerequisites ?? ''" (ngModelChange)="setPrerequisites($event)" />
    </label>

    @if (feature.charges) {
      <div class="charges-row form-grid-4">
        <label class="inline-field">
          <b>Current</b>
          <input
            type="number"
            name="chargesCurrent"
            class="charges-current-input"
            [(ngModel)]="feature.charges.current"
            (ngModelChange)="emitChange()"
          />
        </label>
        <label class="inline-field">
          <b>Total</b>
          <input
            type="number"
            name="chargesTotal"
            class="charges-total-input"
            [(ngModel)]="feature.charges.total"
            (ngModelChange)="emitChange()"
          />
        </label>
        <label class="inline-field">
          <b>Label</b>
          <input
            type="text"
            name="chargesLabel"
            class="charges-label-input"
            [(ngModel)]="feature.charges.label"
            (ngModelChange)="emitChange()"
            placeholder="uses per day"
          />
        </label>
        <!-- whether a rest refills the charges, left on "from label" the label says it ("rages per day") -->
        <label class="inline-field" title="A rest refills charges that come back each day or each encounter">
          <b>Refills</b>
          <select
            name="chargesPer"
            class="charges-per-select"
            [ngModel]="feature.charges.per || ''"
            (ngModelChange)="setChargesPer($event)"
          >
            <option value="">from label ({{ chargesPerFromLabel }})</option>
            <option value="day">each day</option>
            <option value="encounter">each encounter</option>
            <option value="none">never (by rest)</option>
          </select>
        </label>
      </div>
    }

    <div class="description-row">
      <label class="inline-field">
        <b>Description</b>
        <textarea
          name="featureDescription"
          class="feature-description-input description-textarea"
          rows="3"
          [(ngModel)]="feature.description"
          (ngModelChange)="emitChange()"
          placeholder="Description"
        ></textarea>
      </label>
    </div>

    <div class="adjustments-container">
      <app-adjustment-block
        [adjustments]="feature.adjustments"
        (adjustmentsChange)="onAdjustmentsChange($event)"
      ></app-adjustment-block>
    </div>
  </div>
</div>
