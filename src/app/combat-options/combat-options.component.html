<div class="combat-options">
  @for (entry of options(); track entry.option) {
    <label class="combat-option combat-option-{{entry.option}}">
      <input type="checkbox" [checked]="entry.on" (change)="toggle(entry.option, $any($event.target).checked)"/>
      {{entry.label}}
      @if (entry.on && entry.summary) {
        <small class="combat-option-summary">({{entry.summary}})</small>
      }
    </label>
  }
</div>
