@if(character.applied(); as char) {
  @if(attack.range) {
    <span>({{attack.range}}ft) </span>
  }
  <span>{{attack.name}} </span>
  <!--to hit-->
  <stat stat="bab" [ability]="attack.toHitAbility" [additional]="attackRollBonuses()" [additionalTooltips]="attackRollTooltips()" [variantPaths]="toHitVariantPaths()" />
  <!--damage-->
  (
    {{attack.damage}} +<stat [ability]="attack.damageAbility" [additional]="[[attack.damageBonus, 'bonus']]" [variantPaths]="damageVariantPaths()" />
    &#47;
    {{attack.crit}}x{{attack.critMultiplier}}
  )
}
