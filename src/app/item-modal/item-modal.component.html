<div class="modal compact-form">
  <h3>Equipment / Item</h3>
  <div class="modal-body">
    <app-item-form
      [(item)]="item"
      [itemKind]="itemKind"
      (itemKindChange)="typeChange($event)"
    ></app-item-form>
  </div>
  <div class="controls">
    <button type="button" (click)="closeModal()">cancel</button>
    <button type="button" (click)="confirm()">confirm</button>
  </div>
</div>
