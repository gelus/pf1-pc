<div class="modal compact-form" role="dialog" aria-modal="true" [attr.aria-label]="spell.name || 'New spell'">
  <div class="caster-origin-grid form-grid">
    <label class="inline-field">
      <b>Origin</b>
      <input name="origin" type="text" [(ngModel)]="origin" required />
    </label>
    <label class="inline-field">
      <b>Spell Level</b>
      <input name="level" type="number" min="0" [(ngModel)]="levelIndex" />
    </label>

    @if (!original && !character.applied()[type][origin]) {
      <label class="inline-field">
        <b>Caster Name</b>
        <input name="casterName" type="text" [(ngModel)]="caster.name" />
      </label>
      <label class="inline-field">
        <b>Casting Ability</b>
        <input name="ability" type="text" placeholder="int, wis, or cha" [(ngModel)]="caster.ability" />
      </label>
      <label class="inline-field">
        <b>Caster Level</b>
        <input name="casterLevel" type="number" [(ngModel)]="caster.casterLevel" />
      </label>
      <label class="inline-field">
        <b>Concentration Base</b>
        <input name="concentration" type="number" [(ngModel)]="caster.concentration" />
      </label>
    }

    @if (!original && !spellLevelExists()) {
      <label class="inline-field">
        <b>Uses Per Day</b>
        <input name="chargesTotal" type="number" min="0" [(ngModel)]="perDay.total" />
      </label>
      <label class="inline-field">
        <b>Uses Remaining</b>
        <input name="chargesCurrent" type="number" min="0" [(ngModel)]="perDay.current" />
      </label>
      <label class="inline-field">
        <b>Uses Label</b>
        <input name="chargesLabel" type="text" placeholder="spells per day" [(ngModel)]="perDay.label" />
      </label>
    }
  </div>

  <app-spell-form [(spell)]="spell"></app-spell-form>

  <div class="controls">
    <button type="button" (click)="closeModal()">{{original ? 'Close' : 'Cancel'}}</button>
    <button type="button" (click)="save()" [disabled]="!origin.trim() || !spell.name.trim()">Save</button>
    @if (original) {
      <button type="button" class="delete" (click)="delete()">Delete</button>
      <span class="spacer"></span>
      <button type="button" (click)="cast()">Cast</button>
      @if (hasAdjustments()) {
        <button type="button" (click)="cast(true)">Cast on Self</button>
      }
    }
  </div>
</div>
